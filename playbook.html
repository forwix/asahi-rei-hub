<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>朝陽 黎 — 戦略プレイブック</title>
<meta name="description" content="朝陽 黎ブランドの実行計画 / Internal Playbook">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #faf8f5;
    --cream-deep: #f7f3ed;
    --white: #ffffff;
    --orange: #c87941;
    --orange-light: #e8c9a8;
    --orange-soft: #fdf0e3;
    --brown: #2c2825;
    --text: #3a3530;
    --text-muted: #6e6660;
    --border: #ede5d8;
    --strike: #b8a99a;
    --shadow: 0 2px 12px rgba(44, 40, 37, 0.04);
    --shadow-hover: 0 4px 20px rgba(44, 40, 37, 0.08);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--cream);
    color: var(--text);
    font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
    font-weight: 400;
    line-height: 1.85;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Top nav */
  .topnav {
    padding: 20px 0 0;
    animation: fadeIn 0.6s ease-out;
  }
  .topnav a {
    font-size: 12px;
    color: var(--text-muted);
    text-decoration: none;
    letter-spacing: 1px;
    transition: color 0.2s ease;
  }
  .topnav a:hover { color: var(--orange); }

  /* Header */
  .header {
    position: relative;
    padding: 40px 0 50px;
    text-align: center;
    overflow: hidden;
    animation: fadeIn 0.8s ease-out;
  }

  .sun-decoration {
    position: absolute;
    top: -160px;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    height: 320px;
    background: radial-gradient(circle, var(--orange-soft) 0%, rgba(253, 240, 227, 0.4) 40%, transparent 70%);
    border-radius: 50%;
    opacity: 0.85;
    pointer-events: none;
    z-index: 0;
  }

  .header-content { position: relative; z-index: 1; }

  .brand-mark {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--orange);
    font-weight: 500;
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  .page-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 32px;
    font-weight: 500;
    color: var(--brown);
    letter-spacing: 6px;
    margin-bottom: 16px;
    line-height: 1.3;
  }

  .meta {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 2px;
  }

  /* Lead callout */
  .lead {
    margin: 0 0 32px;
    padding: 28px 28px;
    background: var(--white);
    border-radius: 14px;
    border-left: 3px solid var(--orange);
    box-shadow: var(--shadow);
    animation: fadeInUp 0.8s ease-out 0.2s backwards;
  }
  .lead p {
    font-family: 'Noto Serif JP', serif;
    font-size: 15px;
    line-height: 2;
    color: var(--brown);
  }
  .lead strong {
    color: var(--orange);
    font-weight: 500;
  }

  /* Section */
  .section {
    background: var(--white);
    border-radius: 16px;
    padding: 32px 28px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    animation: fadeInUp 0.8s ease-out backwards;
  }
  main > .section:nth-child(1) { animation-delay: 0.25s; }
  main > .section:nth-child(2) { animation-delay: 0.35s; }
  main > .section:nth-child(3) { animation-delay: 0.45s; }
  main > .section:nth-child(4) { animation-delay: 0.55s; }
  main > .section:nth-child(5) { animation-delay: 0.65s; }
  main > .section:nth-child(6) { animation-delay: 0.75s; }

  /* Step header */
  .step-header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 8px;
  }
  .step-num {
    font-family: 'Noto Serif JP', serif;
    font-size: 38px;
    font-weight: 500;
    color: var(--orange);
    line-height: 1;
    letter-spacing: 1px;
  }
  .step-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 19px;
    font-weight: 500;
    color: var(--brown);
    letter-spacing: 2px;
    line-height: 1.4;
  }
  .step-when {
    font-size: 11px;
    color: var(--orange);
    letter-spacing: 3px;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
