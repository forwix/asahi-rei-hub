<style>
*, *::before, *::after { box-sizing: border-box; }

:root {
  --cream: #faf8f5;
  --cream-deep: #f7f3ed;
  --white: #ffffff;
  --orange: #c87941;
  --orange-deep: #b06a38;
  --orange-light: #e8c9a8;
  --orange-soft: #fdf0e3;
  --text: #3a3530;
  --text-muted: #6e6660;
  --border: #ede5d8;
  --shadow: 0 2px 12px rgba(44, 40, 37, 0.06);
}

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--cream);
  color: var(--text);
  font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
  line-height: 1.8;
}

.site-header {
  background: linear-gradient(135deg, var(--orange) 0%, var(--orange-deep) 100%);
  color: var(--white);
  text-align: center;
  padding: 32px 20px 24px;
}

.site-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 32px;
  font-weight: 700;
  margin: 0;
  letter-spacing: 0.2em;
}

.site-subtitle {
  margin: 8px 0 0;
  font-size: 13px;
  letter-spacing: 0.15em;
  opacity: 0.95;
}

.page-title {
  text-align: center;
  font-family: 'Noto Serif JP', serif;
  font-size: 22px;
  color: var(--orange-deep);
  margin: 32px 0 8px;
  font-weight: 700;
}

.page-desc {
  text-align: center;
  font-size: 13px;
  color: var(--text-muted);
  margin: 0 0 24px;
}

.menu-list {
  max-width: 600px;
  margin: 0 auto;
  padding: 0 16px 40px;
}

.menu-item {
  display: block;
  background: var(--white);
  border-radius: 12px;
  padding: 20px 24px;
  margin-bottom: 12px;
  text-decoration: none;
  color: var(--text);
  box-shadow: var(--shadow);
  position: relative;
  transition: all 0.2s ease;
}

.menu-item:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 20px rgba(44, 40, 37, 0.1);
}

.menu-item.current {
  background: var(--orange-soft);
  border: 1px solid var(--orange-light);
}

.menu-item.current::after {
  content: '今ここ';
  position: absolute;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  background: var(--orange);
  color: var(--white);
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 999px;
}

.menu-item:not(.current)::after {
  content: '›';
  position: absolute;
  right: 24px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--orange);
  font-size: 22px;
}

.menu-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--orange-deep);
  margin: 0 0 4px;
}

.menu-desc {
  font-size: 13px;
  color: var(--text-muted);
  margin: 0;
  line-height: 1.7;
}

.section-divider {
  text-align: center;
  font-size: 12px;
  color: var(--text-muted);
  margin: 24px 0 12px;
  letter-spacing: 0.1em;
}

.hub-back {
  display: block;
  text-align: center;
  padding: 16px;
  font-size: 13px;
  color: var(--orange-deep);
  text-decoration: none;
  margin-top: 20px;
}

.hub-back:hover {
  text-decoration: underline;
}

.site-footer {
  background: var(--orange-deep);
  color: var(--white);
  text-align: center;
  padding: 24px 20px;
  margin-top: 40px;
}

.site-footer a {
  color: var(--white);
  text-decoration: none;
  margin: 0 12px;
  font-size: 13px;
}

.site-footer a:hover {
  text-decoration: underline;
}

.copyright {
  margin-top: 16px;
  font-size: 11px;
  opacity: 0.8;
}

/* 下部Information風メニュー */
.info-menu {
  background: var(--cream-deep);
  margin-top: 40px;
  padding: 0;
}

.info-menu-header {
  background: linear-gradient(135deg, var(--orange) 0%, var(--orange-deep) 100%);
  color: var(--white);
  text-align: center;
  padding: 14px 20px;
  font-family: 'Noto Serif JP', serif;
  font-size: 15px;
  letter-spacing: 0.1em;
}

.info-menu-list {
  background: var(--white);
}

.info-menu-list a {
  display: block;
  padding: 16px 20px;
  color: var(--text);
  text-decoration: none;
  font-size: 14px;
  border-bottom: 1px solid var(--cream-deep);
  position: relative;
  background: linear-gradient(to bottom, var(--white) 0%, #f8f6f1 100%);
}

.info-menu-list a:hover {
  background: var(--orange-soft);
}

.info-menu-list a::after {
  content: '›';
  position: absolute;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--orange);
  font-size: 20px;
  font-weight: 300;
}

.info-menu-list a.current {
  color: var(--text-muted);
  background: var(--cream-deep);
}

.info-menu-list a.current::after {
  content: '今ここ';
  font-size: 11px;
  background: var(--orange);
  color: var(--white);
  padding: 3px 10px;
  border-radius: 999px;
  top: 50%;
  transform: translateY(-50%);
  font-weight: 400;
}

.info-menu-divider {
  background: var(--cream-deep);
  height: 4px;
}

</style>
